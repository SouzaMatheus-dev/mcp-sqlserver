[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sqlserver"
version = "0.9.0"
description = "Servidor MCP corporativo para SQL Server com autenticação Windows e modo somente leitura"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MCP-SQL" }]
keywords = ["mcp", "sql-server", "windows-auth", "readonly", "gemini", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "mcp>=1.2.0",
    "pyodbc>=5.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-sqlserver = "mcp_sqlserver.server:run"

[project.urls]
Homepage = "https://github.com/SouzaMatheus-dev/mcp-sqlserver"
Repository = "https://github.com/SouzaMatheus-dev/mcp-sqlserver"
Issues = "https://github.com/SouzaMatheus-dev/mcp-sqlserver/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
