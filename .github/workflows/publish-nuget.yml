name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pack
        run: dotnet pack dotnet/McpSqlServer/McpSqlServer.csproj -c Release -o dotnet/nupkg

      - name: Publish to NuGet.org (Trusted Publisher)
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path dotnet/nupkg/*.nupkg | Select-Object -First 1
          if (-not $package) { throw "Nenhum .nupkg encontrado em dotnet/nupkg" }
          Write-Host "Publicando $($package.FullName) via Trusted Publisher..."
          dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json
