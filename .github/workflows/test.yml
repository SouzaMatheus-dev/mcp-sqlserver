name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -m "not integration"

  dotnet-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build dotnet/McpSqlServer/McpSqlServer.csproj -c Release

  integration:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: McpSqlServer_Test123!
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ODBC Driver 18 and sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
          echo '/opt/mssql-tools18/bin' >> $GITHUB_PATH

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            if sqlcmd -S localhost,1433 -U sa -P "McpSqlServer_Test123!" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server pronto"
              exit 0
            fi
            echo "Aguardando SQL Server... ($i/30)"
            sleep 5
          done
          echo "SQL Server não respondeu a tempo"
          exit 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python integration tests
        env:
          MCPMSSQL_TEST_CONNECTION_STRING: Server=localhost,1433;Uid=sa;Pwd=McpSqlServer_Test123!;TrustServerCertificate=yes;Database=master;
          MSSQL_DRIVER: ODBC Driver 18 for SQL Server
        run: pytest -m integration

      - name: .NET integration tests
        env:
          MCPMSSQL_TEST_CONNECTION_STRING: Server=localhost,1433;User Id=sa;Password=McpSqlServer_Test123!;TrustServerCertificate=True;Database=master;
        run: dotnet test dotnet/McpSqlServer.Tests/McpSqlServer.Tests.csproj -c Release
