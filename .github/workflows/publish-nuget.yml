name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack dotnet/McpSqlServer/McpSqlServer.csproj -c Release -o dotnet/nupkg

      # Trusted Publisher (NuGet.org) — sem API Key quando a policy estiver configurada
      - name: Publish to NuGet.org
        run: dotnet nuget push dotnet/nupkg/*.nupkg --source https://api.nuget.org/v3/index.json
